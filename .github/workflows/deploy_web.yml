name: Deploy Web Portal

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy_web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Web Directory Integrity
        run: |
          test -f web/index.html || { echo "web/index.html missing"; exit 1; }
          test -f web/assets/favicon.svg || { echo "web/assets/favicon.svg missing"; exit 1; }
          echo "Web static assets verified."

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
