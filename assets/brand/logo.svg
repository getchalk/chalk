<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep Obsidian / Graphite) -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Trigonal Calcite Crystal Facets (Monochrome Shading) -->
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="facetMid" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="facetDeep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Master Branch: Trigonal Calcite Prism Facet -->
    <g id="calciteFacet">
      <!-- Facet 1: Primary Upper Chalk Blade -->
      <polygon points="256,80 300,156 256,180 212,156" fill="url(#facetHighlight)" />
      <!-- Facet 2: Chamfered Outer Bevel Arm -->
      <polygon points="300,156 368,274 324,298 256,180" fill="url(#facetMid)" />
      <!-- Facet 3: Inner Calcite Cleavage Edge (Penrose Interlock) -->
      <polygon points="256,180 324,298 280,322 232,238" fill="url(#facetDeep)" />
      <!-- Facet 4: Terminal Chamfer Wedge -->
      <polygon points="256,80 268,60 288,70 300,156" fill="#F1F5F9" opacity="0.9" />
    </g>
  </defs>

  <!-- Squircle Canvas (Subtle Matte Border) -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="url(#bgGrad)" stroke="#1E2330" stroke-width="3"/>
  <rect x="28" y="28" width="456" height="456" rx="112" ry="112" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5"/>

  <!-- Triskelion Center Group (120-Degree Rotational Calcite Lattice) -->
  <g id="triskelion" transform="translate(0, 10)">
    <!-- Branch 0 (Top) -->
    <use href="#calciteFacet" />
    <!-- Branch 1 (Bottom Right: 120 deg) -->
    <use href="#calciteFacet" transform="rotate(120, 256, 256)" />
    <!-- Branch 2 (Bottom Left: 240 deg) -->
    <use href="#calciteFacet" transform="rotate(240, 256, 256)" />

    <!-- Central Micro-Negative Aperture Accent Core -->
    <polygon points="256,228 280,270 232,270" fill="#050608" stroke="#334155" stroke-width="1.5" />
    <circle cx="256" cy="256" r="3" fill="#F8FAFC" opacity="0.8" />
  </g>
</svg>
